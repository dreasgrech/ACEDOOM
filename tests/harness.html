<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ACE DOOM tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<!-- shared test doubles (fake frame clock, in-memory localStorage, console capture) and the library, from the loader repo -->
<script src="../../ACEUIModLoader/tests/lib/doubles.js"></script>
<script src="../../ACEUIModLoader/tests/lib/lib.js"></script>
<link rel="stylesheet" type="text/css" href="../doom/doom.css">
<script src="../doom/png.js"></script>
<script src="../doom/saves.js"></script>
<script src="../doom/audiomap.js"></script>
<script src="../doom/doom.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<canvas id="probe" width="8" height="8"></canvas>
<script>
(function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok;
    const me = ACEUIModLoader.mod("doom");
    const extra = [];
    let frame = 1000;
    let finished = false;
    const nextFrame = function () { frame += 16; window.__clock.step(frame); };
    const finish = function () {
        if (finished) { return; }
        finished = true;
        H.finish(extra);
    };
    const keyEvent = function (type, keyCode, key) {
        const e = new KeyboardEvent(type, { bubbles: true, cancelable: true, key: key || "" });
        Object.defineProperty(e, "keyCode", { value: keyCode });
        window.dispatchEvent(e);
        return e;
    };
    /** Draw an <img> onto the probe canvas and return its RGBA pixels. */
    const pixelsOf = function (img, width, height) {
        const canvas = document.getElementById("probe");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        return ctx.getImageData(0, 0, width, height).data;
    };
    const hex = function (n) { return "0x" + (n >>> 0).toString(16); };

    // ---- the PNG encoder ------------------------------------------------------------

    const W = 4, HGT = 3;
    const bgra = new Uint8Array(W * HGT * 4);
    for (let i = 0; i < W * HGT; i += 1) {
        bgra[i * 4] = i * 20;          // B
        bgra[i * 4 + 1] = 255 - i * 10; // G
        bgra[i * 4 + 2] = i * 5;        // R
        bgra[i * 4 + 3] = 7;            // A (ignored)
    }
    const enc = ACEDoomPng.create(W, HGT);
    const png = ACEDoomPng.encodeBgra(enc, bgra);
    const u32 = function (bytes, at) { return ((bytes[at] << 24) | (bytes[at + 1] << 16) | (bytes[at + 2] << 8) | bytes[at + 3]) >>> 0; };
    const ascii = function (s) { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i += 1) { a[i] = s.charCodeAt(i); } return a; };

    t("png: known CRC-32 and Adler-32 values", function () {
        const check = ascii("123456789");
        eq(hex(ACEDoomPng.crc32(check, 0, check.length)), "0xcbf43926", "crc32 check value");
        eq(hex(ACEDoomPng.adler32(ascii("Wikipedia"), 9)), "0x11e60398", "adler32 check value");
    });

    t("png: a 4x3 frame encodes to a well formed truecolour PNG", function () {
        eq(Array.prototype.slice.call(png, 0, 8).join(","), "137,80,78,71,13,10,26,10", "signature");
        eq(u32(png, 8), 13, "IHDR length"); eq(u32(png, 16), W, "width"); eq(u32(png, 20), HGT, "height");
        eq(png[24], 8, "bit depth"); eq(png[25], 2, "colour type RGB");
        const rawLength = HGT * (1 + W * 3);
        eq(u32(png, 33), 2 + 5 + rawLength + 4, "IDAT length: zlib header + one stored block + adler");
        eq(png[43] & 1, 1, "single block is final");
        eq(png[43 + 5], 0, "first filter byte");
        eq(png[43 + 6], 0, "first pixel R"); eq(png[43 + 7], 255, "first pixel G"); eq(png[43 + 8], 0, "first pixel B");
        eq(png.length, 8 + 25 + 12 + (2 + 5 + rawLength + 4) + 12, "total length");
        eq(u32(png, png.length - 4), 0xae426082, "IEND crc");
    });

    t("png: a 320x200 frame is split into stored blocks of at most 65535 bytes", function () {
        const big = ACEDoomPng.create(320, 200);
        eq(big.raw.length, 200 * 961, "raw scanlines");
        eq(big.slots.map(function (s) { return s.length; }).join(","), "65535,65535,61130", "block sizes");
        eq(big.out[big.slots[0].out - 5], 0, "first block not final"); eq(big.out[big.slots[2].out - 5], 1, "last block final");
        const out = ACEDoomPng.encodeBgra(big, new Uint8Array(320 * 200 * 4));
        eq(out.length, big.length, "returned view spans the whole file");
        const half = ACEDoomPng.create(640, 400, 2);
        eq(half.width + "x" + half.height, "320x200", "step 2 halves both axes");
        const doubled = new Uint8Array(640 * 400 * 4);
        for (let i = 0; i < 640 * 400; i += 1) { doubled[i * 4] = Math.floor(i / 640 / 2) & 255; doubled[i * 4 + 2] = Math.floor((i % 640) / 2) & 255; }
        const small = ACEDoomPng.encodeBgra(half, doubled);
        eq(small[43 + 5 + 1 + 3 * 5], 5, "pixel x=5 samples source x=10 (R)"); eq(small[43 + 5 + 1 + 3 * 5 + 2], 0, "row 0 (B)");
        eq(small[43 + 5 + 961 * 7 + 1 + 2], 7, "row 7 samples source row 14 (B)");
    });

    // ---- the panel -------------------------------------------------------------------

    const root = document.createElement("div");
    root.id = "doom";
    root.setAttribute(ACEUIModLoader.loader.MOUNTED_ATTR, "");
    document.getElementById("center").appendChild(root);
    const state = ACEDoom.attach(root);

    t("attach: closed by default, markup once, hint names the keys, keys mapped from the KEY_* globals", function () {
        ok(root.classList.contains("ace-doom"), "root class"); ok(root.classList.contains("dm-closed"), "closed");
        eq(state.open, false); eq(root.querySelectorAll(".dm-frame").length, 2, "two stacked frame images"); eq(root.querySelectorAll(".dm-frame.dm-shown").length, 1, "one revealed");
        eq(root.querySelector(".dm-title").textContent, "ACE DOOMdev", "title + version outside the game");
        ok(root.querySelector(".dm-hint").textContent.indexOf("Insert show/hide") === 0, "hint");
        eq(root.style.fontSize, "2rem", "default scale"); eq(root.style.visibility, "hidden", "hidden until positioned");
        ok(window.__log.some(function (l) { return l.indexOf(me.prefix + " attached, closed, scale 2, toggle key Insert, module ") === 0; }), "attach log");
        const map = ACEDoom.keyMap({ KEY_LEFTARROW: { value: 172 }, KEY_ESCAPE: { value: 27 }, KEY_FIRE: { value: 157 }, KEY_USE: { value: 162 }, junk: 3 });
        eq(map.keys[37], 172, "left arrow"); eq(map.keys[46], 27, "Delete stands in for Escape"); eq(map.keys[17], 157, "Ctrl fires");
        eq(map.keys[162], 157, "left Ctrl by VK code fires too"); eq(map.named.ControlRight, 157, "right Ctrl by name"); eq(map.named[" "], 162, "space by key value");
        eq(map.keys[27], undefined, "the real Escape is never mapped");
        const fake = { doom: map };
        eq(ACEDoom.doomKeyFor(fake, { keyCode: 0, key: "Control", code: "ControlLeft" }), 157, "modifiers resolve by name when the keyCode is odd");
        eq(ACEDoom.doomKeyFor(fake, { keyCode: 65, key: "a" }), 97, "letters are lower-case ascii");
        eq(ACEDoom.doomKeyFor(fake, { keyCode: 53, key: "5" }), 53, "digits"); eq(ACEDoom.doomKeyFor(fake, { keyCode: 46 }), 27, "special");
        eq(ACEDoom.doomKeyFor(fake, { keyCode: 112, key: "F1" }), null, "unknown keys are left alone");
    });

    t("Insert (by keyCode) opens the panel, persists it, starts loading; holding it does not toggle again", function () {
        keyEvent("keydown", 45); eq(state.open, true, "open"); ok(!root.classList.contains("dm-closed"), "class removed");
        eq(localStorage.getItem("acedoom.open"), "true", "persisted");
        keyEvent("keydown", 45); eq(state.open, true, "auto-repeat ignored"); keyEvent("keyup", 45);
        eq(state.doom.phase, "loading", "boot started");
        ok(window.__log.some(function (l) { return l.indexOf(me.prefix + " loading ") === 0 && l.indexOf("/doom/doomjs.js") > 0; }), "module url from the script's own folder");
    });

    // ---- the module, asynchronously ----------------------------------------------------

    const until = function (cond, then, tries) {
        if (cond()) { then(); return; }
        if (tries <= 0) { then(); return; }
        setTimeout(function () { until(cond, then, tries - 1); }, 20);
    };

    /** Step animation frames (one per 5 ms) until cond holds; then() runs either way after the tries. */
    const stepUntil = function (cond, then, tries) {
        if (cond()) { then(); return; }
        if ((tries === undefined ? 200 : tries) <= 0) { then(); return; }
        nextFrame();
        setTimeout(function () { stepUntil(cond, then, (tries === undefined ? 200 : tries) - 1); }, 5);
    };

    const afterFrames = function (count, then) {
        if (count <= 0) { then(); return; }
        nextFrame();
        setTimeout(function () { afterFrames(count - 1, then); }, 5);
    };

    until(function () { return state.doom.phase !== "loading" && state.doom.phase !== "compiling"; }, function () {
        t("module: doomjs.js loads, instantiates and initialises with the embedded shareware WAD", function () {
            eq(state.doom.phase, "running", "phase");
            ok(state.doom.width > 0 && state.doom.height > 0, "frame size"); ok(state.encoder, "encoder sized");
            ok(state.doom.memory.buffer.byteLength >= 72 * 65536, "memory");
            ok(Object.keys(state.doom.keys).length >= 14, "special keys resolved");
        });
        window.__log.forEach(function (l) {
            if (l.indexOf(me.prefix + " instantiated in") === 0 || l.indexOf(me.prefix + " loaded in") > 0 || l.indexOf(me.prefix + " doom: ") === 0) { extra.push(l); }
        });
        extra.push("frame " + state.doom.width + "x" + state.doom.height);

        afterFrames(40, function () {
            t("40 frames: ticks at 35 Hz, frames drawn, presented and shown through blob PNGs, no errors", function () {
                const s = state.stats;
                ok(s.ticks >= 15 && s.ticks <= 25, "ticks " + s.ticks); ok(s.drawn >= 1, "drawn " + s.drawn);
                ok(s.presented >= 2, "presented " + s.presented); ok(s.shown >= 2, "shown " + s.shown);
                eq(s.errors, 0, "errors"); eq(s.timeouts, 0, "timeouts"); eq(state.blind, false, "load events arrive"); ok(state.doom.clockMs >= 40 * 16, "clock advanced by the frames (" + state.doom.clockMs + ")");
                ok(s.loaded >= 2, "load events " + s.loaded); ok(root.querySelector(".dm-frame.dm-shown").src.indexOf("blob:") === 0, "the shown frame is a blob URL");
                ok(state.frames.every(function (f) { return f.url === null || f.url.indexOf("blob:") === 0; }), "frame URLs are blob URLs");
                extra.push("40 frames: " + JSON.stringify(s));
            });

            t("keys: an arrow key is swallowed and reported to the module, Escape passes through", function () {
                const down = keyEvent("keydown", 37); eq(down.defaultPrevented, true, "arrow swallowed");
                const up = keyEvent("keyup", 37); eq(up.defaultPrevented, true, "keyup swallowed");
                const esc = keyEvent("keydown", 27, "Escape"); eq(esc.defaultPrevented, false, "Escape left to the game");
                eq(state.doom.phase, "running", "still running");
                const input = document.createElement("input");
                document.body.appendChild(input);
                const typed = new KeyboardEvent("keydown", { bubbles: true, cancelable: true, key: "v" });
                Object.defineProperty(typed, "keyCode", { value: 86 });
                input.dispatchEvent(typed);
                eq(typed.defaultPrevented, false, "keys typed into an input are not taken by DOOM");
                const ins = new KeyboardEvent("keydown", { bubbles: true, cancelable: true });
                Object.defineProperty(ins, "keyCode", { value: 45 });
                input.dispatchEvent(ins);
                eq(state.open, true, "Insert typed into an input does not toggle either");
                input.remove();
            });

            t("mouse: left button on the screen fires, right button uses, released anywhere", function () {
                const calls = [];
                const real = { down: state.doom.exports.reportKeyDown, up: state.doom.exports.reportKeyUp };
                const screen = root.querySelector(".dm-screen");
                state.doom.exports.reportKeyDown = function (k) { calls.push(["down", k]); };
                state.doom.exports.reportKeyUp = function (k) { calls.push(["up", k]); };
                screen.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, button: 0 }));
                screen.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, button: 2 }));
                window.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
                screen.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, button: 2 }));
                window.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
                state.doom.exports.reportKeyDown = real.down; state.doom.exports.reportKeyUp = real.up;
                const fire = state.doom.named.Control, use = state.doom.named.Space;
                eq(JSON.stringify(calls), JSON.stringify([["down", fire], ["up", fire], ["down", use], ["up", use]]), "one button at a time, released on window mouseup");
                ok(screen.hasAttribute("data-nodrag"), "pressing the screen does not drag the panel");
            });

            t("audio: mapped sounds become UIAudioRequestAudioEvent requests, quiet, unmapped and excess ones do not; music restarts by length", function () {
                const calls = [];
                window.engine = { trigger: function (channel, name, data) { calls.push([channel, name, data]); } };
                const audio = ACEDoom.imports(state).audio;
                const requestsBefore = state.stats.requests;
                nextFrame();                                   // resets the per-frame cap
                audio.onSoundStart(1, 100, 128);               // pistol -> GUI_PAINT_APPLY (its stock sample is swapped for the pistol)
                eq(calls.length, 1, "one request"); eq(calls[0][0], "OnUICommand"); eq(calls[0][1], "UIAudioRequestAudioEvent");
                eq(JSON.stringify(calls[0][2]), JSON.stringify({ __Type: "UIAudioRequestAudioEvent", type: "GUI_PAINT_APPLY" }), "the stock command shape");
                audio.onSoundStart(10, 100, 128); eq(calls.length, 1, "the chainsaw has no slot");
                audio.onSoundStart(1, ACEDoom.MIN_SOUND_VOLUME - 1, 128); eq(calls.length, 1, "too quiet");
                for (let i = 0; i < 20; i += 1) { audio.onSoundStart(2, 100, 128); }
                eq(calls.length, ACEDoom.MAX_REQUESTS_PER_FRAME, "capped per frame"); nextFrame();
                audio.onSoundStart(2, 100, 128); eq(calls.length, ACEDoom.MAX_REQUESTS_PER_FRAME + 1, "cap reset by the next frame");
                eq(state.stats.requests, requestsBefore + calls.length, "requests counted");
                calls.length = 0;
                audio.onMusicStart(30, 1); eq(state.music, null, "an unmapped track (intro) starts nothing");
                audio.onMusicStart(1, 1);                      // e1m1 -> GUI_PART_APPLY (audiomap.js)
                eq(calls.length, 1, "music requested at once"); eq(calls[0][2].type, "GUI_PART_APPLY"); ok(state.music, "music state");
                audio.onMusicStart(5, 1); audio.onMusicStop(); audio.onMusicStart(30, 1);
                eq(calls.length, 1, "DOOM flipping tracks and stopping does not restart our music");
                state.music.lengthMs = 16 * 40;                // pretend a 640 ms track (the restart margin is 250 ms)
                for (let i = 0; i < 10; i += 1) { nextFrame(); }
                eq(calls.length, 1, "not yet");
                for (let i = 0; i < 20; i += 1) { nextFrame(); }
                eq(calls.length, 2, "looped once by length, ignoring DOOM's track changes");
                const n = calls.length;
                ACEDoom.setOpen(state, false); eq(state.music, null, "closing the panel stops the music");
                for (let i = 0; i < 60; i += 1) { nextFrame(); } eq(calls.length, n, "no restarts after close");
                ACEDoom.setOpen(state, true);
                delete window.engine;
                audio.onSoundStart(1, 100, 128); eq(calls.length, n, "without an engine nothing is requested");
            });

            state.presentingFailed = true;   // hold automatic presents so the pending frame can settle and one frame can be presented by hand
            stepUntil(function () { return !state.frames[1 - state.shown].pending; }, function () {
                const copy = new Uint8Array(state.doom.memory.buffer.slice(state.doom.framePtr, state.doom.framePtr + state.doom.width * state.doom.height * 4));
                const shownBefore = state.shown;
                const countBefore = state.frameCount;
                let loadedAt = -1;
                ACEDoom.present(state, frame);
                ok(state.frames[1 - shownBefore].pending && state.frames[1 - shownBefore].readyAt === -1, "waits for load");
                stepUntil(function () {
                    if (loadedAt < 0 && state.frames[1 - shownBefore].readyAt >= 0) { loadedAt = state.frameCount; }
                    return state.shown !== shownBefore;
                }, function () {
                    t("a frame is revealed swapDelay frames after its load and decodes to the module's pixels", function () {
                        eq(state.shown, 1 - shownBefore, "revealed"); ok(loadedAt > countBefore, "load came after present");
                        eq(state.frameCount - loadedAt, ACEDoom.settings.swapDelay, "revealed exactly swapDelay frames after load");
                        ok(root.querySelector(".dm-frame.dm-shown") === state.frames[state.shown].el, "shown class follows"); eq(state.frames[1 - state.shown].el.classList.contains("dm-shown"), false, "old one hidden");
                        state.presentingFailed = false;
                        const img = state.frames[state.shown].el;
                        const enc = state.encoder, step = enc.step, sw = state.doom.width;
                        eq(step, 2, "the 640x400 module output is 320x200 doubled"); eq(enc.width, 320); eq(enc.height, 200);
                        eq(img.naturalWidth, enc.width, "decoded width"); eq(img.naturalHeight, enc.height, "decoded height");
                        const rgba = pixelsOf(img, enc.width, enc.height);
                        let mismatches = 0, nonBlack = 0, notDoubled = 0;
                        for (let y = 0; y < enc.height; y += 1) {
                            for (let x = 0; x < enc.width; x += 1) {
                                const i = y * enc.width + x, j = (y * step * sw + x * step);
                                if (rgba[i * 4] !== copy[j * 4 + 2] || rgba[i * 4 + 1] !== copy[j * 4 + 1] || rgba[i * 4 + 2] !== copy[j * 4]) { mismatches += 1; }
                                if (copy[j * 4] || copy[j * 4 + 1] || copy[j * 4 + 2]) { nonBlack += 1; }
                                if (copy[j * 4] !== copy[(j + 1) * 4] || copy[j * 4] !== copy[(j + sw) * 4]) { notDoubled += 1; }
                            }
                        }
                        eq(mismatches, 0, "pixel mismatches"); eq(notDoubled, 0, "source pixels really are doubled, so step 2 is lossless"); ok(nonBlack > 1000, "the frame is not blank (" + nonBlack + " lit pixels)");
                    });

                    t("closing pauses: no ticks, frozen clock, state persisted", function () {
                        ACEDoom.setOpen(state, false);
                        const ticks = state.stats.ticks, clock = state.doom.clockMs;
                        nextFrame(); nextFrame(); nextFrame();
                        eq(state.stats.ticks, ticks, "ticks"); eq(state.doom.clockMs, clock, "clock");
                        eq(localStorage.getItem("acedoom.open"), "false"); ok(root.classList.contains("dm-closed"));
                    });

                    t("scale buttons step by 0.5 within 1..4 and persist", function () {
                        root.querySelector("[data-action=larger]").click(); eq(state.scale, 2.5); eq(root.style.fontSize, "2.5rem");
                        eq(ACEUIModLoader.settings.get("doom", "scale"), 2.5, "persisted through the settings store");
                        ACEDoom.setScale(state, 10); eq(state.scale, 4, "clamped high"); ACEDoom.setScale(state, 0); eq(state.scale, 1, "clamped low");

                        /* the same value moved from the settings window has to reach the
                           screen: DOOM's own scaling stored the number and never listened,
                           so the slider there did nothing until the mod restarted */
                        ACEUIModLoader.settings.set("doom", "scale", 3);
                        eq(root.style.fontSize, "3rem", "the settings window moves the screen too");
                        eq(state.scale, 3, "and the state agrees");
                        ACEDoom.setScale(state, 2);

                        root.querySelector("[data-action=close]").click(); eq(state.open, false, "x closes");
                    });

                    /* The key is rebindable, so the controls line on the panel must not go on
                       advertising the default one. */
                    t("the hint follows the show/hide key when it is rebound", function () {
                        const hint = root.querySelector(".dm-hint");

                        ok(hint.textContent.indexOf("Insert show/hide") === 0, "the default to begin with");
                        ACEUIModLoader.settings.set("doom", "toggleKey", "F7");
                        ok(hint.textContent.indexOf("F7 show/hide") === 0, "and the new key after: " + hint.textContent);
                        ACEUIModLoader.settings.set("doom", "toggleKey", "Insert");
                    });

                    t("saves: the codec round-trips exactly, squashes zero runs and refuses junk", function () {
                        const zeros = new Uint8Array(30000);
                        const text = ACEDoomSaves.encode(zeros);
                        ok(text.length < 1000, "30000 zero bytes compact to " + text.length + " characters");
                        const back = ACEDoomSaves.decode(text);
                        eq(back.length, 30000, "length restored");
                        ok(back.every(function (b) { return b === 0; }), "content restored");

                        // save-shaped: repeating structures with a zero tail, then real noise
                        const shaped = new Uint8Array(30000);
                        let seed = 2463534242;
                        const rnd = function (n) {
                            seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0;
                            return seed % n;
                        };
                        for (let i = 0; i < 24000; i += 4) { shaped[i] = rnd(200); }
                        const shapedText = ACEDoomSaves.encode(shaped);
                        const shapedBack = ACEDoomSaves.decode(shapedText);
                        eq(shapedBack.length, shaped.length, "shaped length");
                        let same = true;
                        for (let i = 0; i < shaped.length; i += 1) { if (shaped[i] !== shapedBack[i]) { same = false; break; } }
                        ok(same, "shaped content is byte-identical");

                        eq(ACEDoomSaves.decode(""), null, "empty");
                        eq(ACEDoomSaves.decode("!!!!"), null, "not base64");
                        eq(ACEDoomSaves.decode("AAAA"), null, "wrong format byte");
                        eq(ACEDoomSaves.decode(shapedText.slice(0, 8)), null, "truncated stream");
                    });

                    t("saves: the gameSaving imports read and write the module's memory and report the length back", function () {
                        const before = Object.keys(state.saves).length;
                        eq(ACEDoom.sizeOfSave(state, 3), 0, "an empty slot has no size");
                        eq(ACEDoom.readSave(state, 3, 1024), 0, "and nothing to read");

                        // write a recognisable buffer through the module's memory, as the module would
                        const at = 4096;
                        const length = 600;
                        const memory = new Uint8Array(state.doom.memory.buffer, at, length);
                        for (let i = 0; i < length; i += 1) { memory[i] = (i * 7) & 255; }
                        eq(ACEDoom.writeSave(state, 3, at, length), length, "writeSaveGame returns the length it was given");
                        eq(ACEDoom.sizeOfSave(state, 3), length, "the slot now has that size");
                        eq(state.savesDirty, true, "and the frame loop has something to store");

                        // reading it back must land in the module's memory, byte for byte
                        const to = 8192;
                        eq(ACEDoom.readSave(state, 3, to), length, "readSaveGame reports what it copied");
                        const copy = new Uint8Array(state.doom.memory.buffer, to, length);
                        let same = true;
                        for (let i = 0; i < length; i += 1) { if (copy[i] !== ((i * 7) & 255)) { same = false; break; } }
                        ok(same, "the bytes reached the module unchanged");
                        eq(Object.keys(state.saves).length, before + 1, "one slot used");
                    });

                    t("saves: slots survive a store and reload, and clearing empties both stores", function () {
                        ACEDoom.flushSaves(state);
                        eq(state.savesDirty, false, "stored");
                        const stored = JSON.parse(localStorage.getItem("acedoom.saves"));
                        ok(stored && stored.slots && stored.slots["3"], "localStorage holds the slot");
                        ok(state.savedChars > 0, "and the size is known for the settings pane");

                        const fresh = { saves: {} };
                        const found = ACEDoom.unpackSaves(fresh, stored);
                        eq(found.slots, 1, "one slot restored into a fresh state");
                        eq(fresh.saves["3"].length, state.saves["3"].length, "same length");
                        let same = true;
                        for (let i = 0; i < fresh.saves["3"].length; i += 1) {
                            if (fresh.saves["3"][i] !== state.saves["3"][i]) { same = false; break; }
                        }
                        ok(same, "byte-identical after a round trip through the store");

                        eq(ACEDoom.unpackSaves(fresh, null).slots, 0, "nothing stored restores nothing");
                        eq(ACEDoom.unpackSaves(fresh, { v: 99, slots: {} }).slots, 0, "a format we do not know is ignored");

                        ACEDoom.clearSaves();
                        eq(Object.keys(state.saves).length, 0, "slots gone");
                        eq(localStorage.getItem("acedoom.saves"), null, "localStorage cleared");
                    });

                    t("detach stops the loop, releases listeners and object URLs", function () {
                        const cancelled = window.__clock.cancelled;
                        ACEDoom.detach(state);
                        eq(window.__clock.cancelled, cancelled + 1); eq(state.ui.loop.running, false);
                        ok(state.frames.every(function (f) { return f.url === null && f.pending === false; }), "urls released");
                        keyEvent("keydown", 45); eq(state.open, false, "toggle key released");
                    });

                    finish();
                }, 100);
            }, 100);
        });
    }, 400);

    setTimeout(function () {
        if (finished) { return; }
        t("harness finished within the time budget (module phase " + state.doom.phase + ")", function () { ok(false, "timed out"); });
        finish();
    }, 8000);
}());
</script>
